apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-frontend
data:
  # Browser-facing API URL. Use /api for path-based Ingress (see ingress.yaml).
  # For two hosts / OpenShift Routes, set e.g. https://qa-api.example.com/api
  API_URL: /api
  PORT: "8080"
  # Uncomment to reverse-proxy /api from the frontend pod instead of Ingress:
  # BACKEND_URL: http://qa-backend:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qa-frontend
  template:
    metadata:
      labels:
        app: qa-frontend
    spec:
      containers:
        - name: frontend
          image: qa-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: qa-frontend
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: qa-frontend
spec:
  selector:
    app: qa-frontend
  ports:
    - port: 8080
      targetPort: 8080
